- name: raw_orders
  type: table
outputs:
- name: customer_id
  from_sources:
  - c.customer_id
  derivation: rename
- name: email
  from_sources:
  - c.email
  derivation: rename
- name: last_order_date
  from_sources:
  - r.last_order_date
  derivation: rename
- name: order_count
  from_sources:
  - t.order_count
  derivation: rename
- name: total_revenue
  from_sources:
  - t.total_revenue
  derivation: rename
- name: max_order_global
  from_sources:
  - raw_orders.total_amount
