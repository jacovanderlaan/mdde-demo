target_entity: customer_subqueries
target_layer: business
target_stereotype: fact
description: Subquery shapes that should be lifted to CTEs (plus two that should be
  left inline)
source_entities:
- stg_customers
- raw_orders
attributes:
- target: customer_id
  derivation: rename
  expression: '"c"."customer_id" /* @pk @business_key */ AS "customer_id"'
  sources:
  - entity: c
    attribute: customer_id
- target: email
  derivation: rename
  expression: '"c"."email" /* @pii */ AS "email"'
  sources:
  - entity: c
    attribute: email
- target: last_order_date
  derivation: rename
  expression: '"r"."last_order_date" AS "last_order_date"'
  sources:
  - entity: r
    attribute: last_order_date
- target: order_count
  derivation: rename
  expression: '"t"."order_count" AS "order_count"'
  sources:
  - entity: t
    attribute: order_count
- target: total_revenue
  derivation: rename
  expression: '"t"."total_revenue" AS "total_revenue"'
  sources:
  - entity: t
    attribute: total_revenue
- target: max_order_global
  derivation: aggregate
  expression: (SELECT MAX("raw_orders"."total_amount") AS "_col_0" FROM "raw_orders"
    AS "raw_orders") AS "max_order_global"
  sources:
  - entity: raw_orders
    attribute: total_amount
- target: lifetime_order_count
  derivation: aggregate
  expression: (SELECT COUNT(*) AS "_col_0" FROM "raw_orders" AS "o" WHERE "o"."customer_id"
    = "c"."customer_id") AS "lifetime_order_count"
  sources:
  - entity: o
    attribute: customer_id
  - entity: c
    attribute: customer_id
