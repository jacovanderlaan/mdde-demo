target: customer_revenue_clean
version: 1.0.0
layer: business
stereotype: fact
ctes:
- shipped_orders
- customer_totals
sources:
- name: stg_customers
  type: table
- name: raw_orders
  type: table
outputs:
- name: customer_id
  from_sources:
  - c.customer_id
  derivation: direct
- name: email
  from_sources:
  - c.email
  derivation: direct
- name: first_name
  from_sources:
  - c.first_name
  derivation: direct
- name: last_name
  from_sources:
  - c.last_name
  derivation: direct
- name: order_count
  from_sources:
  - t.order_count
  derivation: direct
- name: total_revenue
  from_sources:
  - t.total_revenue
  derivation: direct
- name: avg_order_value
  from_sources:
  - t.avg_order_value
  derivation: direct
contract:
  owner: <unknown>
  freshness_minutes: 60
  primary_key:
  - order_id
