target_entity: customer_segment_analytics
target_layer: business
target_stereotype: fact_aggregate
description: Customer segment analytics with scalar subqueries and multi-CTE chain
source_entities:
- stg_customers
- raw_orders
attributes:
- target: customer_id
  derivation: rename
  expression: '"rc"."customer_id" /* @pk @business_key */ AS "customer_id"'
  sources:
  - entity: rc
    attribute: customer_id
- target: email
  derivation: rename
  expression: '"c"."email" /* @pii */ AS "email"'
  sources:
  - entity: c
    attribute: email
- target: first_name
  derivation: rename
  expression: '"c"."first_name" /* @pii */ AS "first_name"'
  sources:
  - entity: c
    attribute: first_name
- target: last_name
  derivation: rename
  expression: '"c"."last_name" /* @pii */ AS "last_name"'
  sources:
  - entity: c
    attribute: last_name
- target: order_count
  derivation: rename
  expression: '"rc"."order_count" AS "order_count"'
  sources:
  - entity: rc
    attribute: order_count
- target: total_revenue
  derivation: rename
  expression: '"rc"."total_revenue" AS "total_revenue"'
  sources:
  - entity: rc
    attribute: total_revenue
- target: avg_orders_overall
  derivation: rename
  expression: '"rc"."avg_orders_overall" AS "avg_orders_overall"'
  sources:
  - entity: rc
    attribute: avg_orders_overall
- target: max_revenue_overall
  derivation: rename
  expression: '"rc"."max_revenue_overall" AS "max_revenue_overall"'
  sources:
  - entity: rc
    attribute: max_revenue_overall
- target: revenue_rank
  derivation: rename
  expression: '"rc"."revenue_rank" /* @derived */ AS "revenue_rank"'
  sources:
  - entity: rc
    attribute: revenue_rank
- target: segment
  derivation: rename
  expression: '"rc"."segment" /* @derived */ AS "segment"'
  sources:
  - entity: rc
    attribute: segment
  tags:
  - derived
